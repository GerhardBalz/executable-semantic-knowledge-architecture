name: ROBOT reason and verify

on:
  push:
    paths:
      - "examples/robot-reason-verify/**"
      - ".github/workflows/robot-reason-verify.yml"
  pull_request:
    paths:
      - "examples/robot-reason-verify/**"
      - ".github/workflows/robot-reason-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-robot-reasoning:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Execute ROBOT reason/verify proving ground
        run: bash examples/robot-reason-verify/run.sh
