name: Pizza semantic reasoning

on:
  push:
    paths:
      - "examples/pizza/**"
      - "model/**"
      - ".github/workflows/pizza-spicy.yml"
  pull_request:
    paths:
      - "examples/pizza/**"
      - "model/**"
      - ".github/workflows/pizza-spicy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spicy-pizza:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Run executable semantic reasoning example
        run: bash examples/pizza/run.sh
