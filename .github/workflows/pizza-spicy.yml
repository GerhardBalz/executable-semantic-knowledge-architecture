name: Pizza ESKA reference

on:
  push:
    paths:
      - "README.md"
      - "examples/pizza/**"
      - "model/**"
      - "docs/**"
      - ".github/workflows/pizza-spicy.yml"
  pull_request:
    paths:
      - "README.md"
      - "examples/pizza/**"
      - "model/**"
      - "docs/**"
      - ".github/workflows/pizza-spicy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pizza-eska:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Run semantic reasoning, Knowledge Service, and Knowledge Agent integration
        run: bash examples/pizza/test-agent.sh

      - name: Verify Pizza domain-source ownership boundary
        run: python examples/pizza/verify-domain-source.py

      - name: Verify ESKA core Capability abstraction
        run: bash examples/pizza/verify-core.sh

      - name: Install SHACL validator
        run: python -m pip install -r examples/pizza/validation/requirements.txt

      - name: Run semantic validation example
        run: python examples/pizza/validation/validate.py

      - name: Install rule evaluator
        run: python -m pip install -r examples/pizza/rules/requirements.txt

      - name: Run semantic rule evaluation example
        run: python examples/pizza/rules/evaluate.py

      - name: Install decision evaluator
        run: python -m pip install -r examples/pizza/decisions/requirements.txt

      - name: Run semantic decision example
        run: python examples/pizza/decisions/evaluate.py

      - name: Install calculation evaluator
        run: python -m pip install -r examples/pizza/calculations/requirements.txt

      - name: Run semantic calculation example
        run: python examples/pizza/calculations/evaluate.py

      - name: Install mapping evaluator
        run: python -m pip install -r examples/pizza/mappings/requirements.txt

      - name: Run semantic mapping example
        run: python examples/pizza/mappings/evaluate.py

      - name: Install workflow evaluator
        run: python -m pip install -r examples/pizza/workflows/requirements.txt

      - name: Run semantic workflow example
        run: python examples/pizza/workflows/evaluate.py

      - name: Verify ESKA core execution pattern
        run: bash examples/pizza/verify-core-executions.sh
