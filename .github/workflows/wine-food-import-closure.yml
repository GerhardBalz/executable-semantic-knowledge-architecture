name: Wine Food import closure

on:
  pull_request:
    paths:
      - "examples/wine-food-import-closure/**"
      - ".github/workflows/wine-food-import-closure.yml"
  push:
    branches:
      - main
    paths:
      - "examples/wine-food-import-closure/**"
      - ".github/workflows/wine-food-import-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r examples/wine-food-import-closure/requirements.txt

      - name: Verify Wine/Food import closure and backend invariance
        run: python examples/wine-food-import-closure/verify.py
