name: Travel IRI mapping

on:
  pull_request:
    paths:
      - "examples/travel-iri-mapping/**"
      - ".github/workflows/travel-iri-mapping.yml"
  push:
    branches:
      - main
    paths:
      - "examples/travel-iri-mapping/**"
      - ".github/workflows/travel-iri-mapping.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r examples/travel-iri-mapping/requirements.txt

      - name: Verify Travel semantic identity across physical backends
        run: python examples/travel-iri-mapping/verify.py
