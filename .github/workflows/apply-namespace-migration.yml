name: Apply namespace migration

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'agent/migrate-eska-to-w3id'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Replace provisional ESKA identifiers outside predecessor records
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'urn:eska:core:': 'https://w3id.org/eska#',
              'urn:eska:model:core': 'https://w3id.org/eska/model/core',
              'urn:eska:model:capability': 'https://w3id.org/eska/model/capability',
              'urn:eska:model:service': 'https://w3id.org/eska/model/service',
              'urn:eska:model:agent': 'https://w3id.org/eska/model/agent',
              'urn:eska:model:deployment': 'https://w3id.org/eska/model/deployment',
          }
          excluded = {
              Path('model/publication-contract.json'),
              Path('model/verify-publication-contract.py'),
              Path('model/verify-live-w3id.py'),
              Path('.github/workflows/apply-namespace-migration.yml'),
              Path('.github/workflows/namespace-migration-audit.yml'),
          }
          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path in excluded:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          print(f'Updated {len(changed)} files')
          for path in changed:
              print(f'- {path}')
          PY
      - name: Commit migration replacements when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No namespace replacements remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Migrate ESKA references to permanent W3ID IRIs'
          git push origin HEAD:${{ github.head_ref }}
