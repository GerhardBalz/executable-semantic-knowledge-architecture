name: Namespace migration audit

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: List remaining provisional ESKA identifiers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          needles = ('urn:eska:core:', 'urn:eska:model:')
          allowed = {
              Path('model/publication-contract.json'),
              Path('model/verify-publication-contract.py'),
              Path('model/verify-live-w3id.py'),
              Path('model/namespace-migration.json'),
              Path('docs/w3id-namespace-migration.md'),
              Path('.github/workflows/namespace-migration-audit.yml'),
              Path('.github/workflows/apply-namespace-migration.yml'),
          }
          hits = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path in allowed:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              found = [needle for needle in needles if needle in text]
              if found:
                  hits.append((path, found))
          if hits:
              print('Remaining provisional ESKA identifiers:')
              for path, found in hits:
                  print(f'- {path}: {", ".join(found)}')
              raise SystemExit(1)
          print('SUCCESS: no provisional ESKA identifiers remain outside explicit predecessor records.')
          PY
